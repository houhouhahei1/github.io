<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="0" http-equiv="Expires">
    <meta content="no-cache" http-equiv="Pragma">
    <meta content="no-cache" http-equiv="Cache-control">
    <meta content="no-cache" http-equiv="Cache">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" name="viewport"/>
    <meta content="AI写作, 写作辅助工具, 笔尖传奇, 智能写作助手, 在线写作工具, 自动生成文章, 创意写作, AI作文助手" name="keywords">
    <meta content="笔尖传奇为您提供AI智能写作辅助，帮助快速生成文章、获取创意灵感，提升写作效率，是一款功能强大的AI写作助手。" name="description">
    <!-- 防止页面被重定向 -->
    <link href="images/pen-logo.svg" rel="icon" type="image/svg+xml">
    <title>笔尖传奇 - AI智能写作助手</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            overflow: hidden;
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(78, 110, 242, 0.2);
            pointer-events: none;
        }

        .content-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
        }

        .logo-container {
            margin-bottom: 40px;
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-bg {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); }
            50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15); }
            100% { transform: scale(1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); }
        }

        .logo {
            width: 120px;
            height: 120px;
            position: relative;
            z-index: 2;
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
            background: linear-gradient(to right, #4e6ef2, #00b8d4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: fadeIn 1s ease-out forwards;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.5;
            animation: fadeIn 1s ease-out 0.3s forwards;
            opacity: 0;
        }

        .features {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 20px;
            animation: fadeIn 1s ease-out 0.6s forwards;
            opacity: 0;
        }

        .feature {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .feature-icon {
            margin-right: 10px;
            color: #4e6ef2;
        }

        .feature-text {
            font-size: 0.9rem;
            color: #333;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .logo-container {
                width: 150px;
                height: 150px;
            }

            .logo-bg {
                width: 150px;
                height: 150px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }

            .features {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .logo-container {
                width: 120px;
                height: 120px;
            }

            .logo-bg {
                width: 120px;
                height: 120px;
            }

            .logo {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="particles" id="particles"></div>

        <div class="content-container">
            <div class="logo-container">
                <div class="logo-bg"></div>
                <img src="images/pen-logo.svg" alt="笔尖传奇" class="logo">
            </div>

            <h1 class="title">笔尖传奇</h1>
            <p class="subtitle">API中转站，稳定高效，性能卓越</p>

            <div class="features">
                <div class="feature">
                    <span class="feature-icon">🔄</span>
                    <span class="feature-text">稳定可靠接口</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🚀</span>
                    <span class="feature-text">高性能大模型</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">⚡</span>
                    <span class="feature-text">低延迟响应</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🔐</span>
                    <span class="feature-text">安全数据传输</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 创建粒子背景
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 30 : 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                // 随机大小
                const size = Math.random() * 10 + 5;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;

                // 随机位置
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                particle.style.left = `${left}%`;
                particle.style.top = `${top}%`;

                // 随机透明度
                const opacity = Math.random() * 0.5 + 0.1;
                particle.style.opacity = opacity;

                // 添加动画
                particle.style.animation = `float ${Math.random() * 10 + 10}s infinite ease-in-out`;

                particlesContainer.appendChild(particle);
            }
        }

        // 防止页面被重定向
        if (window.history && window.history.replaceState) {
            window.history.replaceState(null, document.title, window.location.href);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();

            // 自动跳转功能已移除
        });
    </script>
</body>
</html>
